name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Limit token permissions to the bare minimum.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: Unit tests (no credentials required)
        # The ./acceptance package is excluded here because, although its tests
        # gracefully skip without credentials, we exercise them in the next job
        # with the real secrets attached.
        run: go test -race -count=1 ./trello/...

  acceptance:
    name: Read-only acceptance tests
    runs-on: ubuntu-latest
    needs: build
    # Forks don't have access to repository secrets, so skip the acceptance
    # job for pull requests originating from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Acceptance tests
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
        run: |
          if [ -z "${TRELLO_API_KEY}" ] || [ -z "${TRELLO_API_TOKEN}" ]; then
            echo "TRELLO_API_KEY / TRELLO_API_TOKEN secrets are not configured; skipping."
            exit 0
          fi
          go test -count=1 -v ./acceptance/...
